name: Emotion model asset

# Runs once per model revision, not once per release. It exports the ONNX
# classifier, packs the single archive scripts/emotion-asset.json pins and
# uploads it to its own folder on Cloudflare R2
# (https://cdn.cloudowo.com/vrc2t/<tag>/). Every later app release compiles the
# installer against that same archive, so nothing here runs during a release.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace an archive already published in the folder (breaks installers compiled against the old digest)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emotion-asset
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 rejects the checksum headers newer AWS CLIs send by default.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Read the pinned tag and archive name
        id: pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          pin = json.load(open('scripts/emotion-asset.json'))
          for key in ('tag', 'name'):
              print(f'{key}={pin[key]}')
          PY
      - name: Refuse to overwrite a published archive
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          NAME: ${{ steps.pin.outputs.name }}
          REPLACE: ${{ inputs.replace }}
        shell: bash
        run: |
          set -euo pipefail
          # Installers already in the wild verify the old SHA2-512, so a silent
          # replacement would break them; bump the pin instead.
          if aws s3api head-object --bucket "$R2_BUCKET" --key "vrc2t/$TAG/$NAME" --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::$NAME is already published under $TAG. Bump modelVersion, tag and name in scripts/emotion-asset.json, or re-run with replace enabled."
              exit 1
            fi
            echo "::warning::Replacing the published $NAME"
          fi
      - name: Export and validate CPU emotion ONNX (build-only Torch)
        shell: pwsh
        run: ./scripts/prepare-emotion.ps1
      - name: Pack the pinned archive
        run: node scripts/pack-emotion.cjs
      - name: Upload to the pinned folder on R2
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          NAME: ${{ steps.pin.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "build/installer-payload/$NAME" "s3://$R2_BUCKET/vrc2t/$TAG/$NAME" --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: Show the manifest to commit
        shell: bash
        run: |
          {
            echo 'Commit `scripts/emotion-asset.json` with these measurements:'
            echo '```json'
            cat scripts/emotion-asset.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: emotion-asset-manifest
          path: scripts/emotion-asset.json
          if-no-files-found: error
