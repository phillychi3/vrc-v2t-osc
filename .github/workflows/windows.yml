name: Windows regression and clean install

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pydub==0.25.1 "audioop-lts==0.2.2; python_version >= '3.13'"
      - run: python -m unittest tests.test_audio

  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:node
      - run: pnpm typecheck
      - run: pnpm exec eslint .
      - run: pnpm build
      - name: Build isolated CPU backend
        shell: pwsh
        run: ./scripts/build-backend.ps1
      - name: Python regression
        run: ./build/package-env/Scripts/python.exe -m unittest discover -s tests -t .
      - name: Frozen runtime and protocol
        run: ./build/package-env/Scripts/python.exe scripts/smoke-packaged-backend.py build/python/vrc-v2t-backend/vrc-v2t-backend.exe
      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  clean-install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Install and test without development tools on PATH
        shell: pwsh
        run: ./scripts/smoke-clean-install.ps1 -Installer (Get-ChildItem installer/*.exe | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-evidence
          path: build/clean-install-evidence/*
          if-no-files-found: warn
          retention-days: 7
