name: Windows regression and clean install

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pydub==0.25.1 "audioop-lts==0.2.2; python_version >= '3.13'"
      - run: python -m unittest tests.test_audio

  build:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cu126]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm test:node
      - run: pnpm typecheck
      - run: pnpm exec eslint .
      - run: pnpm build
      - name: Electron UI regression with fake backend
        run: pnpm test:renderer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence-${{ matrix.variant }}
          path: build/p5-ui*
          if-no-files-found: warn
      - name: Build isolated ${{ matrix.variant }} backend
        shell: pwsh
        run: ./scripts/build-backend.ps1 -Variant ${{ matrix.variant }}
      - name: Python regression
        run: ./build/runtime-env-${{ matrix.variant }}/Scripts/python.exe -m unittest discover -s tests -t .
      - name: Frozen runtime and protocol
        run: ./build/runtime-env-${{ matrix.variant }}/Scripts/python.exe scripts/smoke-packaged-backend.py build/python-${{ matrix.variant }}/vrc-v2t-backend/vrc-v2t-backend.exe --variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.variant }}
          path: build/python-${{ matrix.variant }}/vrc-v2t-backend
          if-no-files-found: error
          retention-days: 1

  models:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export and validate CPU emotion ONNX (build-only Torch)
        shell: pwsh
        run: ./scripts/prepare-emotion.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: emotion-onnx
          path: build/models/emotion
          if-no-files-found: error
          retention-days: 1

  installer:
    needs: [build, models]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: backend-cpu
          path: build/python-cpu/vrc-v2t-backend
      - uses: actions/download-artifact@v4
        with:
          name: backend-cu126
          path: build/python-cu126/vrc-v2t-backend
      - uses: actions/download-artifact@v4
        with:
          name: emotion-onnx
          path: build/models/emotion
      - name: Pack the backends and emotion model as release assets
        run: pnpm prepare:assets
      - name: Build web installer
        # The app package carries only Electron and the frontend; the
        # selected backend and the optional emotion model are downloaded.
        run: pnpm exec electron-builder --win nsis-web --x64 --publish never
      - name: Installer choice, download and reinstall regression
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-web-setup
          path: release/nsis-web/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-backend-cpu
          path: build/installer-payload/vrc2t-backend-cpu-*.7z
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-backend-cu126
          path: build/installer-payload/vrc2t-backend-cu126-*.7z
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-emotion
          path: build/installer-payload/vrc2t-emotion-*.7z
          if-no-files-found: error
          retention-days: 7

  clean-install:
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cu126]
    steps:
      - uses: actions/checkout@v4
      # The app package and the backend archive are picked up from the
      # installer's own directory, so the run needs no release server.
      - uses: actions/download-artifact@v4
        with:
          name: windows-web-setup
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend-${{ matrix.variant }}
          path: installer
      # The emotion self-test needs the optional model, so install it here.
      - uses: actions/download-artifact@v4
        with:
          name: windows-emotion
          path: installer
      - name: Install and test without development tools on PATH
        shell: pwsh
        run: ./scripts/smoke-clean-install.ps1 -Installer (Get-ChildItem installer/*.exe | Select-Object -First 1).FullName -Variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-evidence-${{ matrix.variant }}
          path: build/clean-install-evidence/*
          if-no-files-found: warn
          retention-days: 7
