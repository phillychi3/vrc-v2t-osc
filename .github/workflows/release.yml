name: Windows release

# The release itself is published by hand. This rebuilds and revalidates the
# tag, then attaches the assets the published installer downloads. It never
# creates, publishes or rewrites a release, so the notes stay as written.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Require a version tag matching package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open('package.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), 'Invalid release version'
          assert os.environ['TAG'] == f'v{version}', 'Release tag must match package.json version'
          PY
      - run: python scripts/sync-version.py --check

  regression:
    needs: validate
    uses: ./.github/workflows/windows.yml

  release:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-web-setup
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend-cpu
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend-cu126
          path: installer
      - name: Attach the installer and backends to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd installer
          VERSION="${TAG#v}"
          # The web installer downloads these assets from this tag, so their
          # names must stay exactly as the installer was compiled to expect.
          # The emotion model is not among them: it stays on its own tag, see
          # scripts/emotion-asset.json and .github/workflows/emotion.yml.
          test -f "VRC2T-${VERSION}-windows-x64-web-setup.exe"
          test -f "vrc2t-${VERSION}-x64.nsis.7z"
          test -f "vrc2t-backend-cpu-${VERSION}-x64.7z"
          test -f "vrc2t-backend-cu126-${VERSION}-x64.7z"
          sha256sum -- *.exe *.7z > SHA256SUMS.txt
          gh release upload "$TAG" ./*.exe ./*.7z SHA256SUMS.txt --clobber
          printf 'Release: %s\n\nValidation: %s\n' "$(gh release view "$TAG" --json url --jq .url)" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
