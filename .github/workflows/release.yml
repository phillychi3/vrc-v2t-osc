name: Windows release

# The release itself is published by hand. This rebuilds and revalidates the
# tag, uploads the assets the published installer downloads to Cloudflare R2
# (https://cdn.cloudowo.com/vrc2t/<tag>/), and attaches only the web installer
# and checksums to the release. It never creates, publishes or rewrites a
# release, so the notes stay as written.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Require a version tag matching package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open('package.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), 'Invalid release version'
          assert os.environ['TAG'] == f'v{version}', 'Release tag must match package.json version'
          PY
      - run: python scripts/sync-version.py --check

  regression:
    needs: validate
    uses: ./.github/workflows/windows.yml

  release:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-web-setup
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend-cpu
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend-cu126
          path: installer
      - name: Upload the installer and backends to R2, attach the installer to the release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksum headers newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd installer
          VERSION="${TAG#v}"
          # The web installer downloads these assets from vrc2t/<tag>/ on R2, so
          # their names must stay exactly as the installer was compiled to expect.
          # The emotion model is not among them: it stays in its own folder, see
          # scripts/emotion-asset.json and .github/workflows/emotion.yml.
          test -f "VRC2T-${VERSION}-windows-x64-web-setup.exe"
          test -f "vrc2t-${VERSION}-x64.nsis.7z"
          test -f "vrc2t-backend-cpu-${VERSION}-x64.7z"
          test -f "vrc2t-backend-cu126-${VERSION}-x64.7z"
          sha256sum -- *.exe *.7z > SHA256SUMS.txt
          for file in ./*.exe ./*.7z SHA256SUMS.txt; do
            aws s3 cp "$file" "s3://$R2_BUCKET/vrc2t/$TAG/$(basename "$file")" --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          gh release upload "$TAG" ./*.exe SHA256SUMS.txt --clobber
          printf 'Release: %s\n\nDownloads: https://cdn.cloudowo.com/vrc2t/%s/\n\nValidation: %s\n' \
            "$(gh release view "$TAG" --json url --jq .url)" "$TAG" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
