appId: com.phillychi3.vrc-v2t-osc
productName: VRC2T
directories:
  output: release
  buildResources: icons
files:
  - build/electron/**/*
  - build/renderer/**/*
  - package.json
extraResources:
  - from: build/models/emotion
    to: models/emotion
    filter:
      - '**/*'
asar: true
# Both backends are published as separate release assets and downloaded by the
# web installer; see scripts/prepare-backends.cjs and scripts/installer.nsh.
publish:
  provider: github
  owner: phillychi3
  repo: vrc-v2t-osc
win:
  artifactName: VRC2T-${version}-windows-${arch}-web-setup.${ext}
  icon: icons/windows/icon.ico
  target: nsis-web
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  installerLanguages:
    - zh_TW
    - en_US
mac:
  icon: icons/macos/icon.icns
  target: dmg
  category: public.app-category.developer-tools
linux:
  icon: icons/linux/icons
  target: AppImage
  category: Utility
