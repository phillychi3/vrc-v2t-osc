appId: com.phillychi3.vrc-v2t-osc
productName: VRC2T
directories:
  output: release
  buildResources: icons
files:
  - build/electron/**/*
  - build/renderer/**/*
  - package.json
extraResources:
  - from: build/python-cpu/vrc-v2t-backend
    to: backend
    filter:
      - '**/*'
asar: true
win:
  artifactName: VRC2T-${version}-windows-${arch}-setup.${ext}
  icon: icons/windows/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  installerLanguages:
    - zh_TW
    - en_US
mac:
  icon: icons/macos/icon.icns
  target: dmg
  category: public.app-category.developer-tools
linux:
  icon: icons/linux/icons
  target: AppImage
  category: Utility
