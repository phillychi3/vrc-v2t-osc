appId: com.phillychi3.vrc-v2t-osc
productName: VRC2T
directories:
  output: release
  buildResources: icons
files:
  - build/electron/**/*
  - build/renderer/**/*
  - package.json
asar: true
# The backends and the optional emotion model are published as separate release
# assets and downloaded by the web installer, so nothing large ships inside the
# app package; see scripts/prepare-assets.cjs and scripts/installer.nsh.
# The web installer fetches the app package from the same Cloudflare R2 folder
# the release workflow uploads each version to.
publish:
  provider: generic
  url: https://cdn.cloudowo.com/vrc2t/v${version}
win:
  artifactName: VRC2T-${version}-windows-${arch}-web-setup.${ext}
  icon: icons/windows/icon.ico
  target: nsis-web
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  installerLanguages:
    - zh_TW
    - en_US
mac:
  icon: icons/macos/icon.icns
  target: dmg
  category: public.app-category.developer-tools
linux:
  icon: icons/linux/icons
  target: AppImage
  category: Utility
