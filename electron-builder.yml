appId: com.phillychi3.vrc-v2t-osc
productName: VRC2T
directories:
  output: release
  buildResources: icons
files:
  - build/electron/**/*
  - build/renderer/**/*
  - package.json
asar: true
# The backends and the optional emotion model are published as separate release
# assets and downloaded by the web installer, so nothing large ships inside the
# app package; see scripts/prepare-assets.cjs and packaging/installer.nsh.
# The web installer fetches the app package from this version's GitHub release,
# and electron-updater finds newer versions through latest.yml on the latest
# release. Only the emotion model is served from Cloudflare R2.
publish:
  provider: github
  owner: phillychi3
  repo: vrc-v2t-osc
  releaseType: release
win:
  artifactName: VRC2T-${version}-windows-${arch}-web-setup.${ext}
  icon: icons/windows/icon.ico
  target: nsis-web
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: packaging/installer.nsh
  installerLanguages:
    - zh_TW
    - en_US
mac:
  icon: icons/macos/icon.icns
  target: dmg
  category: public.app-category.developer-tools
linux:
  icon: icons/linux/icons
  target: AppImage
  category: Utility
