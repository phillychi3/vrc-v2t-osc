<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>VRC V2T OSC 正在啟動</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				overflow: hidden;
				font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
				color: #fafafa;
				background:
					radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.18), transparent 46%), #09090b;
				user-select: none;
			}
			main {
				display: grid;
				justify-items: center;
				gap: 18px;
			}
			.logo {
				display: grid;
				width: 62px;
				height: 62px;
				place-items: center;
				border: 1px solid rgba(251, 146, 60, 0.35);
				border-radius: 18px;
				background: rgba(24, 24, 27, 0.85);
				box-shadow: 0 18px 55px rgba(249, 115, 22, 0.18);
			}
			.wave {
				display: flex;
				align-items: center;
				gap: 4px;
				height: 28px;
			}
			.wave i {
				width: 4px;
				border-radius: 3px;
				background: #fb923c;
				animation: pulse 900ms ease-in-out infinite;
			}
			.wave i:nth-child(1),
			.wave i:nth-child(5) {
				height: 10px;
				animation-delay: -400ms;
			}
			.wave i:nth-child(2),
			.wave i:nth-child(4) {
				height: 19px;
				animation-delay: -200ms;
			}
			.wave i:nth-child(3) {
				height: 28px;
			}
			h1 {
				margin: 0;
				font-size: 18px;
				font-weight: 650;
				letter-spacing: 0.02em;
			}
			p {
				margin: -10px 0 0;
				color: #a1a1aa;
				font-size: 12px;
			}
			.loader {
				width: 150px;
				height: 3px;
				overflow: hidden;
				border-radius: 4px;
				background: #27272a;
			}
			.loader::after {
				content: '';
				display: block;
				width: 45%;
				height: 100%;
				border-radius: inherit;
				background: #f97316;
				animation: loading 1.2s ease-in-out infinite;
			}
			@keyframes pulse {
				0%,
				100% {
					transform: scaleY(0.55);
					opacity: 0.65;
				}
				50% {
					transform: scaleY(1);
					opacity: 1;
				}
			}
			@keyframes loading {
				from {
					transform: translateX(-110%);
				}
				to {
					transform: translateX(330%);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div class="logo" aria-hidden="true">
				<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
			</div>
			<h1>VRC V2T OSC</h1>
			<div class="loader" aria-label="載入中"></div>
		</main>
	</body>
</html>
