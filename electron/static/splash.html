<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>VRC V2T OSC 正在啟動</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				overflow: hidden;
				font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
				color: #fafafa;
				background:
					radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.18), transparent 46%), #09090b;
				user-select: none;
			}
			main {
				display: grid;
				justify-items: center;
				gap: 18px;
			}
			.logo {
				display: block;
				width: 62px;
				height: 62px;
				object-fit: contain;
			}
			h1 {
				margin: 0;
				font-size: 18px;
				font-weight: 650;
				letter-spacing: 0.02em;
			}
			p {
				margin: -10px 0 0;
				color: #a1a1aa;
				font-size: 12px;
			}
			.loader {
				width: 150px;
				height: 3px;
				overflow: hidden;
				border-radius: 4px;
				background: #27272a;
			}
			.loader::after {
				content: '';
				display: block;
				width: 45%;
				height: 100%;
				border-radius: inherit;
				background: #f97316;
				animation: loading 1.2s ease-in-out infinite;
			}
			@keyframes loading {
				from {
					transform: translateX(-110%);
				}
				to {
					transform: translateX(330%);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img class="logo" src="./favicon.png" alt="" aria-hidden="true" />
			<h1>VRC V2T OSC</h1>
			<div class="loader" aria-label="載入中"></div>
		</main>
	</body>
</html>
